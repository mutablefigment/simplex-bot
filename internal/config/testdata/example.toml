[simplex]
ws_url = "ws://127.0.0.1:5225"
allowed_contact_id = 1

[claude]
binary = "/usr/local/bin/claude"
workspace = "/var/lib/claude-bot/workspace"
model = "claude-opus-4-7"
allowed_tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash", "WebFetch"]
disallowed_tools = []
show_tool_use = false
show_cost_footer = true
turn_timeout = "30m"

[storage]
db_path = "/var/lib/claude-bot/state.db"
inbox_dir = "/var/lib/claude-bot/workspace/inbox"
inbox_retention = "720h"
# Largest inbound attachment the bot will download. Human-readable: SI suffixes
# (KB/MB/GB/TB, powers of 1000) and IEC suffixes (KiB/MiB/GiB/TiB, powers of
# 1024) are both accepted; a bare number is raw bytes. 0 disables the cap.
max_attachment_size = "100MiB"

[live_message]
update_interval = "3s"
chunk_threshold = 4096

[log]
level = "info"
format = "json"
log_full_messages = false
